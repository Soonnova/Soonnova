<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientText {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .container {
          position: relative;
          width: 800px;
          height: 120px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        h1 {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          margin: 0;
          font-size: 3.5em;
          font-weight: 900;
          letter-spacing: -.05em;
          text-align: center;
          background: linear-gradient(270deg, #3828ca 0%, #ff004c 50%, #3828ca 100%);
          background-size: 200%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientText 3s ease infinite;
          z-index: 10;
        }

        @keyframes snowflakes-fall {
          0% { top: -10%; }
          100% { top: 110%; }
        }

        @keyframes snowflakes-shake {
          0% { transform: translateX(0px); }
          50% { transform: translateX(30px); }
          100% { transform: translateX(0px); }
        }

        .snowflake {
          position: absolute;
          top: -10%;
          z-index: 5;
          color: #fff;
          font-size: 1.2em;
          font-family: Arial, sans-serif;
          text-shadow: 0 0 3px rgba(255, 255, 255, 0.6);
          user-select: none;
          cursor: default;
          animation-name: snowflakes-fall, snowflakes-shake;
          animation-timing-function: linear, ease-in-out;
          animation-iteration-count: infinite, infinite;
          animation-play-state: running, running;
        }

        .snowflake:nth-of-type(1) { left: 10%; animation-duration: 7s, 2.5s; animation-delay: 0s, 0s; }
        .snowflake:nth-of-type(2) { left: 25%; animation-duration: 9s, 3s; animation-delay: 2s, 1s; }
        .snowflake:nth-of-type(3) { left: 40%; animation-duration: 6s, 2s; animation-delay: 1s, 1.5s; }
        .snowflake:nth-of-type(4) { left: 55%; animation-duration: 8s, 3.5s; animation-delay: 3s, 0.5s; }
        .snowflake:nth-of-type(5) { left: 70%; animation-duration: 10s, 2.8s; animation-delay: 1.5s, 2s; }
        .snowflake:nth-of-type(6) { left: 85%; animation-duration: 7.5s, 3s; animation-delay: 4s, 1s; }
      </style>

      <div class="container">
        <h1>Soon</h1>
        <div class="snowflake">❅</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❅</div>
      </div>
    </div>
  </foreignObject>
</svg>
