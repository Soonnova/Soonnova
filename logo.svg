<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientText {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes fall {
          0% { transform: translateY(-10px) translateX(0); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(210px) translateX(20px); opacity: 0; }
        }
        .container {
          position: relative;
          width: 800px;
          height: 200px;
          overflow: hidden;
          background: linear-gradient(135deg, #0c0c12 0%, #1a1a2e 100%);
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          margin: 0;
        }
        h1 {
          margin: 0;
          font-size: 5rem;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          background: linear-gradient(270deg, #4facfe 0%, #00f2fe 25%, #ff007f 50%, #00f2fe 75%, #4facfe 100%);
          background-size: 400% 400%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientText 8s ease infinite;
          position: relative;
          z-index: 10;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .snowflake {
          position: absolute;
          top: -10px;
          background: white;
          border-radius: 50%;
          animation: fall linear infinite;
          z-index: 5;
          pointer-events: none;
        }
      </style>
      <div class="container">
        <h1>Soonnova</h1>
        <div class="snowflake" style="left: 5%; width: 3px; height: 3px; animation-duration: 4s; animation-delay: 0s;"></div>
        <div class="snowflake" style="left: 15%; width: 2px; height: 2px; animation-duration: 6s; animation-delay: 1s;"></div>
        <div class="snowflake" style="left: 25%; width: 4px; height: 4px; animation-duration: 3.5s; animation-delay: 2s;"></div>
        <div class="snowflake" style="left: 35%; width: 3px; height: 3px; animation-duration: 5s; animation-delay: 0.5s;"></div>
        <div class="snowflake" style="left: 45%; width: 2px; height: 2px; animation-duration: 7s; animation-delay: 1.5s;"></div>
        <div class="snowflake" style="left: 55%; width: 4px; height: 4px; animation-duration: 4.5s; animation-delay: 2.5s;"></div>
        <div class="snowflake" style="left: 65%; width: 3px; height: 3px; animation-duration: 5.5s; animation-delay: 0.8s;"></div>
        <div class="snowflake" style="left: 75%; width: 2px; height: 2px; animation-duration: 6.5s; animation-delay: 1.8s;"></div>
        <div class="snowflake" style="left: 85%; width: 4px; height: 4px; animation-duration: 3.8s; animation-delay: 0.2s;"></div>
        <div class="snowflake" style="left: 95%; width: 3px; height: 3px; animation-duration: 4.8s; animation-delay: 1.2s;"></div>
      </div>
    </div>
  </foreignObject>
</svg>
